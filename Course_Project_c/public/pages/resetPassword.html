<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFitPlan - Login</title>
    <link rel="stylesheet" href="../assets/css/login_signup.css" />
<link rel="icon" type="image/jpg" href="/assets/logo/head/logo.jpg" />
  </head>
  <body>
    <div class="overlay">
      <div class="navbar-container-grid">
        <nav class="navbar">
          <a class="home-button-logo" href="/" >MyFitPlan</a>
          <div class="navbar-buttons-container">
            <a class="button" href="/pages/contact.html" >Contact Us</a>
          </div>
        </nav>
      </div>

      <div class="card">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your details to reset your password</p>

        <form id="resetPasswordForm">
          <div class="input-group">
            <input
              type="email"
              name="email"
              id="loginEmail"
              placeholder="Email Address"
              required
            />
          </div>
          <div class="input-group">
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="Phone Number"
              required
            />
          </div>

          <div class ="input-group">
            <input
              type="password"
              name="newpassword"
              id="newPassword"
              placeholder="New password"
              required
              />
          </div>
          <div class ="input-group">
            <input
              type="password"
              name="confirmpassword"
              id="confirmPassword"
              placeholder="Confirm new password"
              required
              />
          </div>

          <button type="submit" class="btn">Change password</button>
        </form>

        <p class="switch-page">
          Want to create a new account? <a href="/pages/signup.html">Sign Up</a>
        </p>
      </div>
    </div>

    <script src="/assets/js/login.js"></script>
    <script src="/assets/js/resetPassword.js"></script>
  </body>
</html>
